<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博炫技实验室 | 伏杨天</title>
    <meta name="description" content="基于 Canvas 3D 物理引擎构建的交互式技能星图与全息项目投影系统。">

    <!-- 现代字体: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- 智能双路图标库：首选国内高速源，加载失败自动无缝切回国外备用源 -->
    <link id="remixicon-cdn" href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/remixicon/4.2.0/remixicon.css" rel="stylesheet" onerror="fallbackRemixicon()">
    <script>
        function fallbackRemixicon() {
            console.warn("⚠️ [Remixicon CDN Fallback] 实验室首选加速源加载失败，正在自动切回备用 CDN 镜像...");
            const link = document.getElementById('remixicon-cdn');
            if (link) {
                link.href = "https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css";
            }
        }
    </script>

    <!-- 核心样式 -->
    <link rel="stylesheet" href="css/lab.css">
    
    <!-- 预留 Favicon -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>
    <!-- Cyber 3D Background -->
    <div class="cyber-background">
        <div class="cyber-grid"></div>
        <div class="glow-spot glow-spot-1"></div>
        <div class="glow-spot glow-spot-2"></div>
    </div>

    <!-- Main Content Layout -->
    <main class="lab-layout">
        
        <!-- Left Panel: 3D Constellation Sphere -->
        <section class="canvas-panel">
            <!-- UI Corner Details -->
            <div class="corner-decor decor-tl"></div>
            <div class="corner-decor decor-tr"></div>
            <div class="corner-decor decor-bl"></div>
            <div class="corner-decor decor-br"></div>

            <!-- Panel Heading -->
            <div class="panel-header">
                <h2><i class="ri-pulse-line" style="animation: pulse 2s infinite; color: var(--primary);"></i> Skills Constellation // 技能星图</h2>
                <p>MOUSE DRAG TO ROTATE // WHEEL TO ZOOM // CLICK TO PROJECT</p>
            </div>

            <!-- 3D Canvas -->
            <canvas id="constellation-canvas"></canvas>

            <!-- Geek Parameter Control Panel -->
            <div id="param-panel" class="param-control-panel collapsed">
                <button id="toggle-param" class="param-toggle-btn" title="调参控制台">
                    <i class="ri-settings-4-line"></i>
                </button>
                <div class="control-group">
                    <label for="speed-range">自转速度:</label>
                    <input type="range" id="speed-range" min="0.000" max="0.015" step="0.001" value="0.001">
                </div>
                <div class="control-group">
                    <label for="zoom-range">视口缩放:</label>
                    <input type="range" id="zoom-range" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
            </div>
        </section>

        <!-- Right Panel: Hologram Projector -->
        <section class="projector-panel">
            <!-- Top Return Button -->
            <header class="portal-header">
                <div class="logo" style="font-family: var(--font-heading); font-weight: 800; font-size: 1.5rem;">
                    LAB<span>.</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <a href="chip_test.html" class="btn-portal" style="border-color: #00fff9; color: #00fff9; text-shadow: 0 0 10px rgba(0, 255, 249, 0.2);">
                        <i class="ri-cpu-line"></i> 芯片实验室
                    </a>
                    <a href="index.html" class="btn-portal">
                        <i class="ri-portal-line"></i> 返回赛博简历
                    </a>
                </div>
            </header>

            <!-- Hologram Card -->
            <div class="hologram-card">
                <!-- Inner depth gradients -->
                <div class="hologram-depth-bg"></div>

                <!-- Hologram Header -->
                <div class="hologram-title">
                    <h3 id="holo-title" class="glitch-text" data-text="LOADING SYSTEM">LOADING SYSTEM</h3>
                    <div class="tagline">Holographic Projection Matrix</div>
                </div>

                <!-- Hologram Details Body -->
                <div class="hologram-body">
                    <!-- Category Description / Custom Typing -->
                    <p id="holo-category-desc" style="font-size: 0.9rem; line-height: 1.6; color: var(--text-muted);">
                        系统加载中，数据矩阵准备就绪...
                    </p>

                    <!-- Core Level Matrix -->
                    <div class="tech-stat-box">
                        <div class="tech-stat-title">熟练度矩阵 / PROFICIENCY MATRIX</div>
                        <div class="tech-stat-value">
                            <div class="tech-level-bar">
                                <div id="holo-level-fill" class="tech-level-fill"></div>
                            </div>
                            <span id="holo-level-num" class="tech-level-number">00</span><span style="font-size: 0.7rem; color: var(--primary);">%</span>
                        </div>
                    </div>

                    <!-- Project Mappings -->
                    <div class="tech-stat-box" style="flex-grow: 1; display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; max-height: 280px; border-style: solid; border-color: rgba(255,255,255,0.03);">
                        <div class="tech-stat-title">实战项目投射 / PROJECT MAPPING</div>
                        <div id="holo-projects" class="hologram-projects">
                            <!-- JS Dynamically injected -->
                        </div>
                    </div>

                    <!-- System Status Notification -->
                    <div class="system-msg">
                        <div class="system-msg-pulse"></div>
                        <span id="holo-notify-text">SYSTEM // IDLE STATUS</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Core Data and Page Logic -->
    <script src="js/data.js"></script>
    <script src="js/lab.js"></script>
</body>

</html>
